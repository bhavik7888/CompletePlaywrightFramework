name: Playwright Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Midnight health-check smoke run
  workflow_dispatch:   # Allows manual execution triggers from the GitHub UI

permissions:
  contents: write      # Crucial for publishing Allure Report history to the gh-pages branch
  pages: write
  id-token: write

jobs:
  automation-execution:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm ci

    - name: Install Playwright System Browsers
      run: npx playwright install --with-deps

    - name: Run E2E Automated Regressions Suite
      run: npx playwright test

    # --- ADVANCED DASHBOARD REPORTING PIPELINE ---
    - name: Fetch Allure Generation History
      if: always()
      uses: actions/checkout@v4
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Compile Unified Allure Results Matrix
      if: always()
      run: |
        npm run allure:generate
        # Preserves older historical run statistics inside the new build view
        if [ -d "gh-pages/history" ]; then cp -r gh-pages/history allure-report/; fi

    - name: Deploy Live Allure Dashboard Report to GitHub Pages
      if: always() && hashFiles('allure-report/**') != ''
      uses: actions/upload-pages-artifact@v3
      with:
            path: ./allure-report

    # --- MS TEAMS INTEGRATION NOTIFICATIONS LAYER ---
    - name: Dispatch Rich MS Teams Alert
      if: always()
      env:
        TEAMS_WEBHOOK_URL: https://default37709cfbf3b24648aea19c828a8861.47.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/30/workflows/0a696deb8bd346eb8e6019f047325c9e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=CRqEDavPFNzcG4u-zGrgyhP6JE3Aumis3Cq3CwYlzR0
      run: |
        curl --fail-with-body --silent --show-error --request POST \
        -H "Content-Type: application/json" \
        --data-raw '{
          "type": "message",
          "attachments": [
            {
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": "Playwright E2E run: ${{ job.status }}",
                    "weight": "Bolder",
                    "size": "Medium",
                    "color": "${{ job.status == 'success' && 'Good' || 'Attention' }}"
                  },
                  {
                    "type": "FactSet",
                    "facts": [
                      { "title": "Repository:", "value": "${{ github.repository }}" },
                      { "title": "Branch:", "value": "${{ github.ref_name }}" },
                      { "title": "Triggered By:", "value": "@${{ github.actor }}" },
                      { "title": "Environment:", "value": "Production / Shadow Staging" }
                    ]
                  },
                  {
                    "type": "TextBlock",
                    "text": "Open the workflow run for test results, logs, and artifacts.",
                    "wrap": true
                  }
                ],
                "actions": [
                  {
                    "type": "Action.OpenUrl",
                    "title": "🔍 View GitHub Workflow Run",
                    "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  },
                  {
                    "type": "Action.OpenUrl",
                    "title": "📊 Open Allure Dashboard",
                    "url": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
                  }
                ]
              }
            }
          ]
        }' 

  deploy-pages:
    needs: automation-execution
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4